name: Report failed Copr builds

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      test_telegram:
        description: Send a test Telegram message and exit
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install tools
        run: dnf -y install gh git curl python3 gzip
      - uses: actions/checkout@v4
      - name: Report
        env:
          COPR_PROJECT: ${{ vars.COPR_PROJECT }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ inputs.test_telegram }}
        run: ./scripts/report-failures.sh
